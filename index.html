<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trading Bot Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0d1117; color: #e6edf3; padding: 24px; }

        .header { display: flex; align-items: baseline; gap: 20px; margin-bottom: 24px; }
        h1 { color: #58a6ff; font-size: 1.8em; }
        .kapital-inline { color: #3fb950; font-size: 1.4em; font-weight: bold; margin-left: auto; }

        /* CHART */
        .chart-section { margin-bottom: 28px; }
        .chart-title { color: #8b949e; font-size: 0.85em; margin-bottom: 8px; }
        #chart-symbol { color: #58a6ff; font-weight: bold; }
        #tradingview-widget {
            width: 100%;
            max-width: 1400px;
            height: 550px;
            margin: 0 auto;
        }
        #tradingview-widget iframe { width: 100%; height: 100%; border: none; border-radius: 10px; }

        /* TABS */
        .tabs { display: flex; gap: 4px; border-bottom: 1px solid #30363d; margin-bottom: 20px; }
        .tab {
            padding: 12px 20px; cursor: pointer; color: #8b949e;
            font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .tab:hover { color: #e6edf3; }
        .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* PUZZLE GRID */
        .grid { display: flex; flex-wrap: wrap; gap: 16px; }
        .card {
            background: #161b22; border: 1px solid #30363d; border-radius: 12px;
            padding: 20px; width: 220px; cursor: pointer; transition: all 0.2s;
        }
        .card:hover { border-color: #58a6ff; transform: translateY(-2px); }
        .card.selected { border-color: #58a6ff; box-shadow: 0 0 10px rgba(88,166,255,0.3); }
        .card-symbol { font-size: 1.1em; font-weight: bold; color: #e6edf3; margin-bottom: 4px; }
        .card-price { font-size: 1.4em; font-weight: bold; color: #58a6ff; margin-bottom: 14px; }

        .indicators { display: flex; flex-direction: column; gap: 8px; }
        .indicator { display: flex; align-items: center; gap: 8px; font-size: 0.85em; color: #8b949e; }
        .lamp { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: #21262d; }
        .lamp.green { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
        .lamp.red { background: #f85149; box-shadow: 0 0 6px #f85149; }

        /* HISTORY TABLE */
        table { width: 100%; border-collapse: collapse; }
        th { background: #161b22; color: #58a6ff; padding: 12px 10px; text-align: left; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 10px; border-bottom: 1px solid #21262d; font-size: 0.9em; }
        tr:hover td { background: #161b22; }
        .long { color: #3fb950; font-weight: bold; }
        .short { color: #f85149; font-weight: bold; }
        .pnl-pos { color: #3fb950; }
        .pnl-neg { color: #f85149; }
        .empty { color: #8b949e; text-align: center; padding: 24px; }

        /* STATS */
        .stats { display: flex; flex-wrap: wrap; gap: 16px; }
        .stat-card {
            background: #161b22; border: 1px solid #30363d; border-radius: 12px;
            padding: 20px; min-width: 180px;
        }
        .stat-label { color: #8b949e; font-size: 0.85em; margin-bottom: 6px; }
        .stat-value { font-size: 1.6em; font-weight: bold; color: #58a6ff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 Trading Bot</h1>
        <span class="kapital-inline" id="kapital">$1000.00</span>
    </div>

    <div class="chart-section">
        <div class="chart-title">Chart: <span id="chart-symbol">BTC/USDT</span></div>
        <div id="tradingview-widget"></div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="showTab('watching')">Watching List</div>
        <div class="tab" onclick="showTab('history')">Position History</div>
        <div class="tab" onclick="showTab('stats')">Statistics</div>
    </div>

    <div id="watching" class="tab-content active">
        <div class="grid" id="grid"></div>
    </div>

    <div id="history" class="tab-content">
        <table>
            <thead>
                <tr><th>Time</th><th>Pair</th><th>Direction</th><th>Entry</th><th>Close</th><th>PnL</th></tr>
            </thead>
            <tbody id="historia-tabela">
                <tr><td colspan="6" class="empty">No closed positions yet</td></tr>
            </tbody>
        </table>
    </div>

    <div id="stats" class="tab-content">
        <div class="stats" id="stats-grid"></div>
    </div>

    <script>
        let aktualnyCoin = "BTC/USDT";

        function showTab(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(name).classList.add('active');
        }

        function zmienWykres(coin) {
            aktualnyCoin = coin;
            const symbolUrl = coin.replace('/', '');
            document.getElementById('chart-symbol').innerText = coin;
            document.getElementById('tradingview-widget').innerHTML = `
                <iframe
                    src="https://www.tradingview.com/widgetembed/?symbol=OKX:${symbolUrl}&interval=15&theme=dark&style=1&studies=BB%40tv-basicstudies%1EStochasticRSI%40tv-basicstudies&hide_top_toolbar=0&save_image=0"
                    style="width:100%;height:100%;border:none;border-radius:10px;"></iframe>`;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            const sel = document.querySelector(`[data-coin="${coin}"]`);
            if (sel) sel.classList.add('selected');
        }
        zmienWykres("BTC/USDT");

        async function odswierz() {
            try {
                const res = await fetch('/api/stan');
                const dane = await res.json();

                const kEl = document.getElementById('kapital');
                kEl.innerText = `$${dane.kapital.toFixed(2)}`;
                kEl.style.color = dane.kapital >= 1000 ? '#3fb950' : '#f85149';

                const grid = document.getElementById('grid');
                grid.innerHTML = '';
                for (const [coin, info] of Object.entries(dane.coiny)) {
                    const bbSygnal = info.cena > info.bb_gorna ? 'red' :
                                     info.cena < info.bb_dolna ? 'green' : '';
                    const stochSygnal = info.stochrsi > 80 ? 'red' :
                                        info.stochrsi < 20 ? 'green' : '';
                    const pozSygnal = info.pozycja_otwarta ?
                        (info.pozycja_typ === 'long' ? 'green' : 'red') : '';

                    const bbText = info.cena > info.bb_gorna ? 'Above upper BB' :
                                   info.cena < info.bb_dolna ? 'Below lower BB' : 'Inside BB';
                    const stochText = info.stochrsi > 80 ? `Overbought (${info.stochrsi.toFixed(0)})` :
                                      info.stochrsi < 20 ? `Oversold (${info.stochrsi.toFixed(0)})` :
                                      `Neutral (${info.stochrsi.toFixed(0)})`;
                    const pozText = info.pozycja_otwarta ?
                        `${info.pozycja_typ.toUpperCase()} @ $${info.pozycja_entry.toFixed(2)}` :
                        'No position';

                    const selected = coin === aktualnyCoin ? 'selected' : '';
                    grid.innerHTML += `
                        <div class="card ${selected}" data-coin="${coin}" onclick="zmienWykres('${coin}')">
                            <div class="card-symbol">${coin}</div>
                            <div class="card-price">$${info.cena.toFixed(4)}</div>
                            <div class="indicators">
                                <div class="indicator"><div class="lamp ${bbSygnal}"></div><span>${bbText}</span></div>
                                <div class="indicator"><div class="lamp ${stochSygnal}"></div><span>${stochText}</span></div>
                                <div class="indicator"><div class="lamp ${pozSygnal}"></div><span>${pozText}</span></div>
                            </div>
                        </div>`;
                }
            } catch(e) { console.error(e); }

            try {
                const res2 = await fetch('/api/historia');
                const hist = await res2.json();
                const tabela = document.getElementById('historia-tabela');
                if (hist.length === 0) {
                    tabela.innerHTML = '<tr><td colspan="6" class="empty">No closed positions yet</td></tr>';
                } else {
                    tabela.innerHTML = [...hist].reverse().map(h => `
                        <tr>
                            <td>${h.time}</td>
                            <td><b>${h.pair}</b></td>
                            <td class="${h.direction.toLowerCase()}">${h.direction}</td>
                            <td>$${h.entry}</td>
                            <td>$${h.close}</td>
                            <td class="${h.pnl >= 0 ? 'pnl-pos' : 'pnl-neg'}">${h.pnl >= 0 ? '+' : ''}$${h.pnl}</td>
                        </tr>`).join('');
                }

                // Statistics
                const total = hist.length;
                const wins = hist.filter(h => h.pnl > 0).length;
                const losses = hist.filter(h => h.pnl < 0).length;
                const totalPnl = hist.reduce((sum, h) => sum + h.pnl, 0);
                const winrate = total > 0 ? ((wins / total) * 100).toFixed(1) : 0;
                const bestTrade = total > 0 ? Math.max(...hist.map(h => h.pnl)).toFixed(2) : 0;
                const worstTrade = total > 0 ? Math.min(...hist.map(h => h.pnl)).toFixed(2) : 0;

                document.getElementById('stats-grid').innerHTML = `
                    <div class="stat-card"><div class="stat-label">Total Trades</div><div class="stat-value">${total}</div></div>
                    <div class="stat-card"><div class="stat-label">Win Rate</div><div class="stat-value">${winrate}%</div></div>
                    <div class="stat-card"><div class="stat-label">Wins / Losses</div><div class="stat-value">${wins} / ${losses}</div></div>
                    <div class="stat-card"><div class="stat-label">Total PnL</div><div class="stat-value" style="color:${totalPnl >= 0 ? '#3fb950' : '#f85149'}">${totalPnl >= 0 ? '+' : ''}$${totalPnl.toFixed(2)}</div></div>
                    <div class="stat-card"><div class="stat-label">Best Trade</div><div class="stat-value" style="color:#3fb950">+$${bestTrade}</div></div>
                    <div class="stat-card"><div class="stat-label">Worst Trade</div><div class="stat-value" style="color:#f85149">$${worstTrade}</div></div>
                `;
            } catch(e) { console.error(e); }
        }

        odswierz();
        setInterval(odswierz, 1000);
    </script>
</body>
</html>
